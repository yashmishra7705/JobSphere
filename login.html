<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere - Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="nav">

        <div class="logo">
            Job<span>Sphere</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#jobs">Jobs</a>
            <a href="index.html#career-ai">Career AI</a>
            <a href="index.html#about">About Us</a>

            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="register-btn">Register</a>
        </div>

    </nav>


    <!-- LOGIN SECTION -->
    <section class="login-section">

        <div class="login-card">

            <div class="login-icon">
                👤
            </div>

            <h1>Welcome Back!</h1>

            <p class="login-subtitle">
                Login to continue your JobSphere journey
            </p>


            <form>

                <!-- EMAIL -->
                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <!-- OPTIONS -->
                <div class="login-options">

                    <label>
                        <input type="checkbox">
                        Remember me
                    </label>

                    <a href="#">
                        Forgot Password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->
                <button type="submit" class="login-submit">
                    Login
                </button>

            </form>


            <!-- REGISTER -->
            <p class="register-text">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            Job<span>Sphere</span>
        </div>

        <p>
            AI-Enhanced Job & Career Portal
        </p>

        <p class="copyright">
            © 2026 JobSphere. All Rights Reserved.
        </p>

    </footer>

</body>
</html>
