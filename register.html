<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JobSphere - Register</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- NAVBAR -->
    <nav class="nav">

        <div class="logo">
            Job<span>Sphere</span>
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#jobs">Jobs</a>
            <a href="index.html#career-ai">Career AI</a>
            <a href="index.html#about">About Us</a>

            <a href="login.html" class="login-btn">Login</a>
            <a href="register.html" class="register-btn">Register</a>
        </div>

    </nav>


    <!-- REGISTER SECTION -->
    <section class="register-section">

        <div class="register-card">

            <div class="register-icon">
                👤
            </div>

            <h1>Create Your Account</h1>

            <p class="register-subtitle">
                Join JobSphere and start your career journey
            </p>


            <form id="registerForm">

                <!-- FULL NAME -->
                <div class="form-group">

                    <label for="fullname">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="fullname"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <!-- EMAIL -->
                <div class="form-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <!-- PASSWORD -->
                <div class="form-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        required
                    >

                </div>


                <!-- CONFIRM PASSWORD -->
                <div class="form-group">

                    <label for="confirm-password">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm-password"
                        placeholder="Confirm your password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->
                <button type="submit" class="register-submit">
                    Create Account
                </button>

            </form>


            <!-- LOGIN LINK -->
            <p class="register-text">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>


    <!-- FOOTER -->
    <footer>

        <div class="footer-logo">
            Job<span>Sphere</span>
        </div>

        <p>
            AI-Enhanced Job & Career Portal
        </p>

        <p class="copyright">
            © 2026 JobSphere. All Rights Reserved.
        </p>

    </footer>

    <script src="/js/script.js"></script>
</script>   
alert("JavaScript Loaded!");
</script>

</body>
</html>
